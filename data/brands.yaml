# База брендов (ТЗ F-4.3.1). Стартовый набор; целевой объём ≥ 100 (TODO: дополнить).
# Бесплатные почтовые домены (gmail.com, outlook.com, icloud.com) НЕ входят в domains бренда:
# письмо с gmail.com — не «официальное письмо Google» (см. data/free_mail_domains.txt, D-05).
# name        — отображаемое имя
# domains     — официальные домены (письмо с них считается легитимным при SPF+DKIM+DMARC pass)
# esp_domains — домены рассылочных платформ/партнёров, с которых бренд реально шлёт
# keywords    — слова в теме/теле, по которым определяется имитация (без учёта регистра)
# locale      — kz | ru | global
# colors      — фирменные цвета (hex) для сравнения скриншотов (TODO F-4.3.2)
# logo_phash  — pHash логотипа (TODO F-4.3.2)
