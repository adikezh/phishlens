# docker compose up → демо на http://localhost:8082 с тремя примерами.
# LLM: раскомментируйте ollama или задайте OPENROUTER_KEY / ANTHROPIC_API_KEY и включите llm.enabled.
services:
  init-data:
    image: alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
    command: ["sh", "-c", "mkdir -p /app/var && chown -R 65532:65532 /app/var"]
    user: "0:0"
    volumes:
      - phishlens-data:/app/var

  phishlens:
    build: ..
    image: "${PHISHLENS_IMAGE:-ghcr.io/adikezh/phishlens:v0.2.5}"
    ports: ["${PHISHLENS_PORT:-8082}:8082"]
    environment:
      PL_STORAGE_DSN: "file:/app/var/phishlens.db?_pragma=journal_mode(WAL)&_pragma=busy_timeout(5000)"
      PL_LOG_PRETTY: "false"
      PL_OCR_MODE: "${PL_OCR_MODE:-off}"
      PL_OCR_TESSERACT_URL: "${PL_OCR_TESSERACT_URL:-http://ocr:8090}"
      # PL_LLM_ENABLED: "true"
      # OPENROUTER_KEY: ${OPENROUTER_KEY}
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # PL_ENC_KEY: ${PL_ENC_KEY}          # phishlens keygen
    volumes:
      - phishlens-data:/app/var
    depends_on:
      init-data:
        condition: service_completed_successfully
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/app/phishlens", "healthcheck", "--url", "http://127.0.0.1:8082/health"]
      interval: 30s

  # ollama:
  #   image: ollama/ollama
  #   volumes: ["ollama:/root/.ollama"]
  #   # docker compose exec ollama ollama pull qwen2.5:14b

  ocr:                                   # включается профилем: docker compose --profile ocr up
    profiles: ["ocr"]
    build: ./ocr
    environment:
      OCR_LANG: "eng+rus+kaz"
      OCR_MAX_IMAGE_BYTES: "26214400"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    ports: ["8090:8090"]

  # sandbox:                               # deploy/sandbox — headless Chromium (Business)
  #   build: ./sandbox
  #   network_mode: none

volumes:
  phishlens-data:
  # ollama:
