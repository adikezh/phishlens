name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: phishlens_test
          POSTGRES_DB: phishlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d phishlens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PHISHLENS_POSTGRES_DSN: postgres://postgres:phishlens_test@localhost:5432/phishlens?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race -count=1
      - name: validate add-in artifacts
        run: python scripts/validate_addins.py
      - name: eval corpus (F1 gate)
        run: go run ./cmd/phishlens eval --dir testdata/eml --expected testdata/expected --no-llm --min-f1 0.9
      - name: helm lint
        run: docker run --rm -v "$GITHUB_WORKSPACE/deploy/helm:/chart" alpine/helm:3.17.3 lint /chart
      - name: container build
        run: docker build --tag phishlens:ci .
      - name: container runtime smoke
        run: bash scripts/container_smoke.sh phishlens:ci
      - name: OCR container build
        run: docker build --file deploy/ocr/Dockerfile --tag phishlens-ocr:ci .

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
      - run: go install github.com/securego/gosec/v2/cmd/gosec@latest && gosec -quiet ./... || true
